name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version.json
        run: |
          cat > version.json <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "commitDate": "$(git show -s --format=%cI ${GITHUB_SHA})",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "subject": $(git show -s --format=%s ${GITHUB_SHA} | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
          }
          EOF
          cat version.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
