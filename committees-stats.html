<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Breakdown - Election Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #6f42c1, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ff6b6b;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .committee-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .committee-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .committee-icon {
            font-size: 2.5rem;
        }

        .committee-title {
            font-size: 1.4rem;
            color: #ffd700;
        }

        .committee-total {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .country-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .country-list li {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .country-list li:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .country-list li:last-child {
            border-bottom: none;
        }

        .rank-position {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .rank-position.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        .rank-position.silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .rank-position.bronze { background: linear-gradient(135deg, #cd7f32, #b87333); color: #000; }

        .country-name {
            flex: 1;
            color: #fff;
            font-size: 1rem;
        }

        .country-count {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 40px;
            text-align: right;
        }

        .country-years {
            color: #a0a0a0;
            font-size: 0.85rem;
            margin-left: 8px;
            min-width: 50px;
        }

        .year-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-left: 15px;
            max-width: 300px;
        }

        .year-badge {
            background: rgba(111, 66, 193, 0.3);
            color: #b794f6;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }

        .no-data-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .committee-header {
                flex-direction: column;
                text-align: center;
            }

            .year-badges {
                display: none;
            }

            .stats-bar {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="country-stats.html?stat=committee" class="back-link">&larr; Back to Committee Statistics</a>

        <header>
            <h1>Committee Breakdown</h1>
            <p class="subtitle">Which countries chaired each parliamentary committee</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalCommittees">0</div>
                <div class="stat-label">Committees</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalYears">0</div>
                <div class="stat-label">Years of History</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalChairs">0</div>
                <div class="stat-label">Total Chairmanships</div>
            </div>
        </div>

        <div id="committeesContent"></div>
    </div>

    <script>
        const HISTORY_STORAGE_KEY = 'electionCalculatorHistory';
        let history = [];

        const parliamentaryCommittees = [
            { name: 'Budget & Finance', icon: '💰' },
            { name: 'Foreign Affairs', icon: '🌍' },
            { name: 'Defense & Security', icon: '🛡️' },
            { name: 'Constitutional & Legal', icon: '⚖️' },
            { name: 'Economic Affairs', icon: '📈' },
            { name: 'Social Affairs', icon: '👥' },
            { name: 'Health', icon: '🏥' },
            { name: 'Education & Science', icon: '🎓' },
            { name: 'Environment', icon: '🌱' },
            { name: 'Agriculture', icon: '🌾' },
            { name: 'Transport & Infrastructure', icon: '🚆' },
            { name: 'Culture & Media', icon: '🎭' },
            { name: 'European Affairs', icon: '🇪🇺' },
            { name: 'Human Rights', icon: '✊' },
            { name: 'Public Administration', icon: '🏛️' }
        ];

        function loadHistory() {
            const data = localStorage.getItem(HISTORY_STORAGE_KEY);
            if (data) {
                history = JSON.parse(data);
            }
            renderCommitteeBreakdown();
        }

        function renderCommitteeBreakdown() {
            const content = document.getElementById('committeesContent');
            const totalCommitteesEl = document.getElementById('totalCommittees');
            const totalYearsEl = document.getElementById('totalYears');
            const totalChairsEl = document.getElementById('totalChairs');

            if (history.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📜</div>
                        <h2>No History Yet</h2>
                        <p>Save governments from the Election Calculator to see committee statistics.</p>
                    </div>
                `;
                return;
            }

            // Build committee data: for each committee, which countries chaired and in which years
            const committeeData = {};
            parliamentaryCommittees.forEach(c => {
                committeeData[c.name] = {
                    icon: c.icon,
                    countries: {} // { countryName: { count: N, years: [year1, year2, ...] } }
                };
            });

            let totalChairs = 0;

            history.forEach(entry => {
                if (entry.committees) {
                    entry.committees.forEach(c => {
                        // Find the real country for this party
                        let realCountry = null;
                        if (entry.qualifiedParties) {
                            const party = entry.qualifiedParties.find(p => p.name === c.partyName);
                            if (party && party.realCountry) {
                                realCountry = party.realCountry;
                            }
                        }

                        if (realCountry && committeeData[c.committeeName]) {
                            if (!committeeData[c.committeeName].countries[realCountry]) {
                                committeeData[c.committeeName].countries[realCountry] = {
                                    count: 0,
                                    years: []
                                };
                            }
                            committeeData[c.committeeName].countries[realCountry].count++;
                            committeeData[c.committeeName].countries[realCountry].years.push(entry.year);
                            totalChairs++;
                        }
                    });
                }
            });

            // Update stats
            totalCommitteesEl.textContent = parliamentaryCommittees.length;
            totalYearsEl.textContent = history.length;
            totalChairsEl.textContent = totalChairs;

            // Render each committee
            let html = '';
            parliamentaryCommittees.forEach(committee => {
                const data = committeeData[committee.name];
                const countries = Object.entries(data.countries)
                    .map(([name, info]) => ({ name, ...info }))
                    .sort((a, b) => b.count - a.count);

                const totalForCommittee = countries.reduce((sum, c) => sum + c.count, 0);

                html += `
                    <div class="committee-section">
                        <div class="committee-header">
                            <span class="committee-icon">${data.icon}</span>
                            <div>
                                <h2 class="committee-title">${committee.name}</h2>
                                <p class="committee-total">${totalForCommittee} total chairmanship${totalForCommittee !== 1 ? 's' : ''}</p>
                            </div>
                        </div>
                `;

                if (countries.length === 0) {
                    html += `
                        <div class="no-data">
                            <div class="no-data-icon">📊</div>
                            <p>No data available yet</p>
                        </div>
                    `;
                } else {
                    html += '<ul class="country-list">';
                    countries.forEach((country, index) => {
                        let rankClass = '';
                        if (index === 0) rankClass = 'gold';
                        else if (index === 1) rankClass = 'silver';
                        else if (index === 2) rankClass = 'bronze';

                        // Show years (limit to last 5 for display)
                        const displayYears = country.years.slice(-5);
                        const hasMore = country.years.length > 5;

                        html += `
                            <li>
                                <span class="rank-position ${rankClass}">${index + 1}</span>
                                <span class="country-name">${country.name}</span>
                                <span class="country-count">${country.count}</span>
                                <span class="country-years">year${country.count !== 1 ? 's' : ''}</span>
                                <div class="year-badges">
                                    ${hasMore ? '<span class="year-badge">...</span>' : ''}
                                    ${displayYears.map(y => `<span class="year-badge">${y}</span>`).join('')}
                                </div>
                            </li>
                        `;
                    });
                    html += '</ul>';
                }

                html += '</div>';
            });

            content.innerHTML = html;
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
