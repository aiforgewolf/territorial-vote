<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country History - Election Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #6f42c1, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ff6b6b;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.8rem;
        }

        .crown-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .crown-badge {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.4);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
        }

        .crown-badge-value {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }

        .crown-badge-label {
            color: #e94560;
            font-size: 0.85rem;
        }

        .section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ---- influence ---- */
        .infl-headline {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 22px;
        }

        .infl-hero {
            flex: 1 1 190px;
            background: linear-gradient(135deg, rgba(111, 66, 193, 0.25), rgba(155, 89, 182, 0.12));
            border: 1px solid rgba(155, 89, 182, 0.4);
            border-radius: 12px;
            padding: 16px 18px;
        }
        .infl-hero .ih-label {
            color: #a0a0a0;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .infl-hero .ih-value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffd700;
            line-height: 1.2;
        }
        .infl-hero .ih-sub { color: #b0b0c0; font-size: 0.85rem; }

        .infl-mini {
            flex: 1 1 120px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }
        .infl-mini .im-value { font-size: 1.6rem; font-weight: 700; color: #fff; }
        .infl-mini .im-label { color: #a0a0a0; font-size: 0.78rem; }

        .podium-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }
        .podium-card {
            flex: 1 1 110px;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid;
        }
        .podium-card .pc-value { font-size: 1.7rem; font-weight: 700; }
        .podium-card .pc-label { font-size: 0.8rem; }
        .podium-gold   { background: rgba(255, 215, 0, 0.12);   border-color: rgba(255, 215, 0, 0.45); }
        .podium-gold   .pc-value, .podium-gold   .pc-label { color: #ffd700; }
        .podium-silver { background: rgba(192, 192, 192, 0.12); border-color: rgba(192, 192, 192, 0.45); }
        .podium-silver .pc-value, .podium-silver .pc-label { color: #d8d8d8; }
        .podium-bronze { background: rgba(205, 127, 50, 0.12);  border-color: rgba(205, 127, 50, 0.45); }
        .podium-bronze .pc-value, .podium-bronze .pc-label { color: #cd7f32; }
        .podium-rise   { background: rgba(46, 204, 113, 0.12);  border-color: rgba(46, 204, 113, 0.4); }
        .podium-rise   .pc-value, .podium-rise   .pc-label { color: #7ee2a8; }
        .podium-fall   { background: rgba(231, 76, 60, 0.1);    border-color: rgba(231, 76, 60, 0.35); }
        .podium-fall   .pc-value, .podium-fall   .pc-label { color: #ef9a92; }

        .infl-chart { display: block; width: 100%; height: auto; margin-bottom: 8px; }
        .infl-chart .g-line { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
        .infl-chart .a-line { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; }
        .infl-chart .a-text { fill: #8a8a9a; font-size: 11px; }

        .infl-table-wrap { overflow-x: auto; }
        table.infl-table { width: 100%; border-collapse: collapse; min-width: 460px; }
        table.infl-table th {
            text-align: left;
            padding: 9px 12px;
            color: #a0a0a0;
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            white-space: nowrap;
        }
        table.infl-table td {
            padding: 9px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        table.infl-table tr:hover { background: rgba(255, 255, 255, 0.04); }
        table.infl-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        .rank-pill {
            display: inline-block;
            min-width: 30px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.1);
            color: #d0d0d0;
        }
        .rank-pill.r1 { background: rgba(255, 215, 0, 0.22);   color: #ffd700; }
        .rank-pill.r2 { background: rgba(192, 192, 192, 0.22); color: #e8e8e8; }
        .rank-pill.r3 { background: rgba(205, 127, 50, 0.22);  color: #e0a066; }
        .delta-up   { color: #7ee2a8; }
        .delta-down { color: #ef9a92; }
        .delta-flat { color: #7a7a8a; }
        .infl-note { color: #8a8a9a; font-size: 0.85rem; margin-top: 10px; }
        .infl-note a { color: #ffd700; }

        .section h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .timeline {
            position: relative;
        }

        .timeline-year {
            display: flex;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timeline-year:last-child {
            border-bottom: none;
        }

        .year-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
            min-width: 60px;
        }

        .year-content {
            flex: 1;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px;
        }

        .role-pm {
            background: rgba(111, 66, 193, 0.3);
            color: #b794f6;
        }

        .role-king {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }

        .role-queen {
            background: rgba(255, 105, 180, 0.2);
            color: #ff69b4;
        }

        .role-opposition {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .role-committee {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .role-coalition {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        .role-elected {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
        }

        .party-name {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .committees-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .committee-tag {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .no-activity {
            color: #555;
            font-style: italic;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
        }

        .summary-card h3 {
            color: #e94560;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .summary-list {
            list-style: none;
        }

        .summary-list li {
            padding: 4px 0;
            font-size: 0.85rem;
            color: #ddd;
            display: flex;
            justify-content: space-between;
        }

        .summary-count {
            color: #ffd700;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .stats-bar { gap: 10px; }
            .stat-item { min-width: 80px; padding: 10px 15px; }
            .stat-value { font-size: 1.4rem; }
            .timeline-year { flex-direction: column; gap: 10px; }
            .crown-stats { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="countries-dataset.html" class="back-link">&larr; Back to Countries Dataset</a>

        <header>
            <h1 id="countryName">Country</h1>
            <p class="subtitle">Complete historical record</p>
        </header>

        <div id="content"></div>
    </div>

    <script src="influence.js"></script>
    <script>
        const HISTORY_STORAGE_KEY = 'electionCalculatorHistory';
        let history = [];

        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function loadHistory() {
            const data = localStorage.getItem(HISTORY_STORAGE_KEY);
            if (data) {
                history = JSON.parse(data);
            }
            render();
        }

        function getRealCountry(entry, role) {
            const obj = entry[role];
            if (!obj) return null;
            let realCountry = obj.realCountry;
            if (!realCountry && obj.country && entry.qualifiedParties) {
                const party = entry.qualifiedParties.find(p => p.name === obj.country);
                realCountry = party?.realCountry;
            }
            return realCountry || null;
        }

        // -------------------------------------------------------------
        // Influence
        //
        // Recomputed from the saved history on every load, exactly like the
        // influence page - nothing about influence is ever stored.
        // -------------------------------------------------------------

        /**
         * Everything this page needs about one country's influence:
         * its value and rank each cycle, plus the derived tallies.
         */
        function buildInfluenceView(country) {
            if (typeof InfluenceModel === 'undefined') return null;

            const timeline = InfluenceModel.computeTimeline(history);
            if (timeline.countries.indexOf(country) === -1) return null;

            const series = timeline.series[country];
            const earned = timeline.earned[country];

            const rows = timeline.years.map((year, i) => {
                const value = series[i];
                // Competition ranking: one plus however many countries are
                // strictly ahead, so ties share a place.
                const ahead = timeline.countries
                    .filter(c => timeline.series[c][i] > value + 1e-9).length;
                const field = timeline.countries
                    .filter(c => timeline.series[c][i] > 0).length;
                const previous = i > 0 ? series[i - 1] : 0;

                return {
                    year: year,
                    value: value,
                    earned: earned[i],
                    change: value - previous,
                    rank: ahead + 1,
                    field: field
                };
            });

            const last = rows[rows.length - 1];
            const peak = rows.reduce((best, r) => (r.value > best.value ? r : best), rows[0]);

            return {
                rows: rows,
                current: last,
                peak: peak,
                gold:   rows.filter(r => r.rank === 1).length,
                silver: rows.filter(r => r.rank === 2).length,
                bronze: rows.filter(r => r.rank === 3).length,
                gained:  rows.filter(r => r.change > 1e-9).length,
                dropped: rows.filter(r => r.change < -1e-9).length,
                decay: timeline.decay
            };
        }

        /** Single-series influence chart, drawn as a plain inline SVG. */
        function influenceChartSvg(rows) {
            const W = 900, H = 250, L = 56, R = 16, T = 14, B = 34;
            const plotW = W - L - R;
            const plotH = H - T - B;

            const maxValue = Math.max(...rows.map(r => r.value), 1);
            const step = Math.pow(10, Math.floor(Math.log10(maxValue / 4)));
            const axisStep = Math.ceil((maxValue / 4) / step) * step;
            const axisMax = axisStep * 4;

            const x = i => rows.length === 1 ? L + plotW / 2 : L + (i / (rows.length - 1)) * plotW;
            const y = v => T + plotH - (v / axisMax) * plotH;

            const parts = [];

            for (let g = 0; g <= 4; g++) {
                const value = axisStep * g;
                const py = y(value);
                parts.push(`<line class="g-line" x1="${L}" y1="${py}" x2="${L + plotW}" y2="${py}"/>`);
                parts.push(`<text class="a-text" x="${L - 8}" y="${py + 4}" text-anchor="end">${Math.round(value)}</text>`);
            }

            parts.push(`<line class="a-line" x1="${L}" y1="${T}" x2="${L}" y2="${T + plotH}"/>`);
            parts.push(`<line class="a-line" x1="${L}" y1="${T + plotH}" x2="${L + plotW}" y2="${T + plotH}"/>`);

            const labelEvery = Math.max(1, Math.ceil(rows.length / 12));
            rows.forEach((row, i) => {
                if (i % labelEvery !== 0 && i !== rows.length - 1) return;
                parts.push(`<text class="a-text" x="${x(i)}" y="${T + plotH + 17}" text-anchor="middle">${row.year}</text>`);
            });

            if (rows.length > 1) {
                const line = rows.map((r, i) => `${x(i)},${y(r.value)}`).join(' L ');
                parts.push(`<path d="M ${x(0)},${T + plotH} L ${line} L ${x(rows.length - 1)},${T + plotH} Z" fill="rgba(155,89,182,0.18)"/>`);
                parts.push(`<path d="M ${line}" fill="none" stroke="#b06fe0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
            }

            const medalColor = { 1: '#ffd700', 2: '#d8d8d8', 3: '#cd7f32' };
            rows.forEach((row, i) => {
                const color = medalColor[row.rank] || '#b06fe0';
                const radius = row.rank <= 3 ? 5 : 3.5;
                parts.push(
                    `<circle cx="${x(i)}" cy="${y(row.value)}" r="${radius}" fill="${color}" stroke="#1a1a2e" stroke-width="1.5">` +
                    `<title>Year ${row.year}: ${Math.round(row.value)} influence, rank ${row.rank} of ${row.field}</title>` +
                    `</circle>`
                );
            });

            return `<svg class="infl-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${parts.join('')}</svg>`;
        }

        function renderInfluenceSection(country) {
            const view = buildInfluenceView(country);
            if (!view) return '';

            const fmt = v => v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(1);
            const ordinal = n => {
                const suffix = (n % 100 >= 11 && n % 100 <= 13) ? 'th'
                    : ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
                return n + suffix;
            };

            const rowsHtml = view.rows.slice().reverse().map(row => {
                const rankClass = row.rank <= 3 ? ` r${row.rank}` : '';
                const medal = { 1: '🥇', 2: '🥈', 3: '🥉' }[row.rank] || '';
                let delta;
                if (row.change > 1e-9) {
                    delta = `<span class="delta-up">▲ ${fmt(row.change)}</span>`;
                } else if (row.change < -1e-9) {
                    delta = `<span class="delta-down">▼ ${fmt(Math.abs(row.change))}</span>`;
                } else {
                    delta = '<span class="delta-flat">—</span>';
                }

                return `
                    <tr>
                        <td><strong>${row.year}</strong></td>
                        <td><span class="rank-pill${rankClass}">${row.rank}</span> ${medal}
                            <span style="color:#7a7a8a;font-size:0.8rem;">of ${row.field}</span></td>
                        <td class="num"><strong>${fmt(row.value)}</strong></td>
                        <td class="num">${delta}</td>
                        <td class="num" style="color:#9be89b;">${row.earned > 0 ? '+' + fmt(row.earned) : '—'}</td>
                    </tr>`;
            }).join('');

            return `
                <div class="section">
                    <h2>📈 Influence</h2>

                    <div class="infl-headline">
                        <div class="infl-hero">
                            <div class="ih-label">Current influence</div>
                            <div class="ih-value">${fmt(view.current.value)}</div>
                            <div class="ih-sub">as of year ${view.current.year}</div>
                        </div>
                        <div class="infl-hero">
                            <div class="ih-label">Current position</div>
                            <div class="ih-value">${ordinal(view.current.rank)}</div>
                            <div class="ih-sub">of ${view.current.field} countries</div>
                        </div>
                        <div class="infl-mini">
                            <div class="im-value">${fmt(view.peak.value)}</div>
                            <div class="im-label">Peak (year ${view.peak.year})</div>
                        </div>
                        <div class="infl-mini">
                            <div class="im-value">${view.rows.length}</div>
                            <div class="im-label">Cycles tracked</div>
                        </div>
                    </div>

                    <div class="podium-row">
                        <div class="podium-card podium-gold">
                            <div class="pc-value">${view.gold}</div>
                            <div class="pc-label">🥇 Years 1st</div>
                        </div>
                        <div class="podium-card podium-silver">
                            <div class="pc-value">${view.silver}</div>
                            <div class="pc-label">🥈 Years 2nd</div>
                        </div>
                        <div class="podium-card podium-bronze">
                            <div class="pc-value">${view.bronze}</div>
                            <div class="pc-label">🥉 Years 3rd</div>
                        </div>
                        <div class="podium-card podium-rise">
                            <div class="pc-value">${view.gained}</div>
                            <div class="pc-label">▲ Years gained</div>
                        </div>
                        <div class="podium-card podium-fall">
                            <div class="pc-value">${view.dropped}</div>
                            <div class="pc-label">▼ Years lost</div>
                        </div>
                    </div>

                    ${influenceChartSvg(view.rows)}

                    <div class="infl-table-wrap">
                        <table class="infl-table">
                            <thead>
                                <tr>
                                    <th>Year</th>
                                    <th>Rank</th>
                                    <th class="num">Influence</th>
                                    <th class="num">Change</th>
                                    <th class="num">Earned</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>

                    <p class="infl-note">
                        Influence is recalculated from the saved history, never stored. Points are earned for
                        the roles held each cycle and fade by ×${view.decay} per cycle thereafter.
                        <a href="influence.html">See the full model and weights →</a>
                    </p>
                </div>`;
        }

        function render() {
            const content = document.getElementById('content');
            const countryNameEl = document.getElementById('countryName');
            const country = getUrlParam('country');

            if (!country) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🌍</div>
                        <h2>No Country Selected</h2>
                        <p>Please select a country from the Countries Dataset.</p>
                    </div>
                `;
                return;
            }

            countryNameEl.textContent = country;
            document.title = `${country} - Election Calculator`;

            if (history.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📜</div>
                        <h2>No History Yet</h2>
                        <p>Save governments from the Election Calculator to see country history.</p>
                    </div>
                `;
                return;
            }

            // Calculate country statistics
            const stats = {
                elected: 0,
                govRule: 0,
                king: 0,
                queen: 0,
                opposition: 0,
                committees: 0,
                ministers: 0,
                participation: 0,
                doubleCrown: 0,
                tripleCrown: 0
            };

            const ministerTitles = [
                'Finance', 'Foreign Affairs', 'Interior', 'Defense',
                'Justice', 'Health', 'Education', 'Economy',
                'Labor', 'Environment', 'Transport', 'Agriculture', 'Culture', 'Energy'
            ];

            const yearlyData = [];
            const partyNames = new Set();
            const committeeChairs = {};
            const ministerPositions = {};

            history.forEach(entry => {
                const yearData = {
                    year: entry.year,
                    roles: [],
                    committees: [],
                    parties: []
                };

                const pmCountry = entry.primeMinister?.realCountry;
                let kingCountry = getRealCountry(entry, 'king');
                let queenCountry = getRealCountry(entry, 'queen');
                const oppositionCountry = entry.oppositionLeader?.realCountry;

                // Check if elected (qualified parties)
                if (entry.qualifiedParties) {
                    entry.qualifiedParties.forEach(party => {
                        if (party.realCountry === country) {
                            stats.elected++;
                            yearData.roles.push({ type: 'elected', party: party.name });
                            partyNames.add(party.name);
                        }
                    });
                }

                // Check PM
                if (pmCountry === country) {
                    stats.govRule++;
                    yearData.roles.push({
                        type: 'pm',
                        party: entry.primeMinister.name,
                        partyName: entry.coalitionParties?.find(p => p.realCountry === country)?.name
                    });
                }

                // Check King
                if (kingCountry === country) {
                    stats.king++;
                    yearData.roles.push({
                        type: 'king',
                        name: entry.king.name,
                        party: entry.king.country
                    });
                }

                // Check Queen
                if (queenCountry === country) {
                    stats.queen++;
                    yearData.roles.push({
                        type: 'queen',
                        name: entry.queen.name,
                        party: entry.queen.country
                    });
                }

                // Check Opposition
                if (oppositionCountry === country) {
                    stats.opposition++;
                    yearData.roles.push({
                        type: 'opposition',
                        party: entry.oppositionLeader.name
                    });
                }

                // Check Coalition Participation
                if (entry.coalitionParties) {
                    const inCoalition = entry.coalitionParties.some(cp => {
                        let rc = cp.realCountry;
                        if (!rc && entry.qualifiedParties) {
                            const match = entry.qualifiedParties.find(p => p.name === cp.name);
                            rc = match?.realCountry;
                        }
                        return rc === country;
                    });
                    if (inCoalition) {
                        stats.participation++;
                        if (pmCountry !== country) {
                            yearData.roles.push({ type: 'coalition' });
                        }
                    }
                }

                // Check Committees
                if (entry.committees && entry.qualifiedParties) {
                    entry.committees.forEach(c => {
                        const party = entry.qualifiedParties.find(p => p.name === c.partyName);
                        if (party?.realCountry === country) {
                            stats.committees++;
                            yearData.committees.push(c.committeeName);
                            committeeChairs[c.committeeName] = (committeeChairs[c.committeeName] || 0) + 1;
                        }
                    });
                }

                // Check Minister Positions
                if (entry.governmentMinisters && entry.governmentMinisters.length > 0) {
                    const pmPartyName = entry.primeMinister ? entry.primeMinister.name : null;
                    let ministerIndex = 0;

                    // PM position
                    if (pmCountry === country) {
                        stats.ministers++;
                        ministerPositions['Prime Minister'] = (ministerPositions['Prime Minister'] || 0) + 1;
                    }

                    // Other minister positions
                    entry.governmentMinisters.forEach(m => {
                        const isPMParty = pmPartyName && m.name === pmPartyName;
                        const ministersToAssign = isPMParty ? m.ministers - 1 : m.ministers;

                        for (let i = 0; i < ministersToAssign && ministerIndex < ministerTitles.length; i++) {
                            const positionName = ministerTitles[ministerIndex];
                            if (m.realCountry === country) {
                                stats.ministers++;
                                ministerPositions[positionName] = (ministerPositions[positionName] || 0) + 1;
                            }
                            ministerIndex++;
                        }
                    });
                }

                // Check Double/Triple Crown
                if (pmCountry === country && kingCountry === country) {
                    stats.doubleCrown++;
                }
                if (pmCountry === country && kingCountry === country && queenCountry === country) {
                    stats.tripleCrown++;
                }

                if (yearData.roles.length > 0 || yearData.committees.length > 0) {
                    yearlyData.push(yearData);
                }
            });

            // Check if country has any history
            if (yearlyData.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h2>No History Found</h2>
                        <p>${country} has no recorded history in the database.</p>
                    </div>
                `;
                return;
            }

            let html = '';

            // Stats bar
            html += `
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value">${stats.elected}</div>
                        <div class="stat-label">🗳️ Elected</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.govRule}</div>
                        <div class="stat-label">🏛️ Gov Rule</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.king}</div>
                        <div class="stat-label">🤴 King</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.queen}</div>
                        <div class="stat-label">👸 Queen</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.opposition}</div>
                        <div class="stat-label">📢 Opposition</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.committees}</div>
                        <div class="stat-label">🏛️ Committees</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.ministers}</div>
                        <div class="stat-label">🏛️ Ministers</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stats.participation}</div>
                        <div class="stat-label">🤝 Participation</div>
                    </div>
                </div>
            `;

            // Crown achievements
            if (stats.doubleCrown > 0 || stats.tripleCrown > 0) {
                html += '<div class="crown-stats">';
                if (stats.doubleCrown > 0) {
                    html += `
                        <div class="crown-badge">
                            <div class="crown-badge-value">${stats.doubleCrown}</div>
                            <div class="crown-badge-label">👑👑 Double Crown</div>
                        </div>
                    `;
                }
                if (stats.tripleCrown > 0) {
                    html += `
                        <div class="crown-badge">
                            <div class="crown-badge-value">${stats.tripleCrown}</div>
                            <div class="crown-badge-label">👑👑👑 Triple Crown</div>
                        </div>
                    `;
                }
                html += '</div>';
            }

            // Summary section
            html += `
                <div class="section">
                    <h2>📊 Summary</h2>
                    <div class="summary-grid">
            `;

            // Committee breakdown
            if (Object.keys(committeeChairs).length > 0) {
                const sortedCommittees = Object.entries(committeeChairs)
                    .sort((a, b) => b[1] - a[1]);
                html += `
                    <div class="summary-card">
                        <h3>🏛️ Committee Chairs</h3>
                        <ul class="summary-list">
                            ${sortedCommittees.map(([name, count]) => `
                                <li><span>${name}</span><span class="summary-count">${count}</span></li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            // Minister positions breakdown
            if (Object.keys(ministerPositions).length > 0) {
                const sortedMinisters = Object.entries(ministerPositions)
                    .sort((a, b) => b[1] - a[1]);
                html += `
                    <div class="summary-card">
                        <h3>🏛️ Minister Positions</h3>
                        <ul class="summary-list">
                            ${sortedMinisters.map(([name, count]) => `
                                <li><span>${name}</span><span class="summary-count">${count}</span></li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            // Parties used
            if (partyNames.size > 0) {
                html += `
                    <div class="summary-card">
                        <h3>🎭 Parties Represented</h3>
                        <ul class="summary-list">
                            ${[...partyNames].map(name => `
                                <li><span>${name}</span></li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            html += '</div></div>';

            // Influence section
            html += renderInfluenceSection(country);

            // Timeline section
            html += `
                <div class="section">
                    <h2>📅 Year-by-Year Timeline</h2>
                    <div class="timeline">
            `;

            yearlyData.reverse().forEach(yd => {
                html += `
                    <div class="timeline-year">
                        <div class="year-label">${yd.year}</div>
                        <div class="year-content">
                `;

                yd.roles.forEach(role => {
                    switch (role.type) {
                        case 'pm':
                            html += `<span class="role-badge role-pm">🏛️ Prime Minister</span>`;
                            break;
                        case 'king':
                            html += `<span class="role-badge role-king">🤴 King ${role.name}</span>`;
                            break;
                        case 'queen':
                            html += `<span class="role-badge role-queen">👸 Queen ${role.name}</span>`;
                            break;
                        case 'opposition':
                            html += `<span class="role-badge role-opposition">📢 Opposition Leader</span>`;
                            break;
                        case 'coalition':
                            html += `<span class="role-badge role-coalition">🤝 Coalition Partner</span>`;
                            break;
                        case 'elected':
                            html += `<span class="role-badge role-elected">🗳️ Elected <span class="party-name">(${role.party})</span></span>`;
                            break;
                    }
                });

                if (yd.committees.length > 0) {
                    html += `
                        <div class="committees-list">
                            ${yd.committees.map(c => `<span class="committee-tag">🏛️ ${c}</span>`).join('')}
                        </div>
                    `;
                }

                html += '</div></div>';
            });

            html += '</div></div>';

            content.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
    <script src="version.js"></script>
</body>
</html>
